<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Chamados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --bg: #f8fafc;
    --text: #1e293b;
    --card: #ffffff;
    --border: #e2e8f0;
    --navbar: linear-gradient(90deg, #0d6efd, #0a58ca);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --text: #f8fafc;
    --card: #1e293b;
    --border: #334155;
    --navbar: linear-gradient(90deg, #1e40af, #1e3a8a);
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.3s, color 0.3s;
  }

  .navbar {
    background: var(--navbar);
    color: #fff !important;
  }

  .navbar .navbar-brand {
    color: #fff !important;
    font-weight: 600;
  }

  .card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    transition: background-color 0.3s, border 0.3s;
  }

  .table {
    color: var(--text);
  }

  .table thead th {
    background-color: var(--border);
  }

  .btn {
    border-radius: 0.4rem;
    font-weight: 500;
  }

  .theme-toggle {
    background: transparent;
    color: #fff;
    border: none;
    font-size: 1.3rem;
  }

  footer {
    text-align: center;
    padding: 12px;
    color: #6c757d;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid px-4">
    <span class="navbar-brand"><i class="bi bi-headset"></i> Sistema de Chamados</span>
    <div class="d-flex align-items-center gap-2">
      <button id="themeToggle" class="theme-toggle"><i class="bi bi-moon-fill"></i></button>
      <button id="logoutBtn" class="btn btn-light btn-sm d-none"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </div>
</nav>

<!-- LOGIN -->
<div class="container" id="loginContainer">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow-sm mt-5">
        <h4 class="text-center mb-3 text-primary"><i class="bi bi-person-circle"></i> Login</h4>
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input type="text" class="form-control" id="loginUser" placeholder="Digite seu login">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="loginPass" placeholder="Digite sua senha">
        </div>
        <button class="btn btn-primary w-100" id="loginBtn">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- SISTEMA -->
<div class="container d-none" id="mainContainer">
  <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
    <h3 class="text-primary"><i class="bi bi-ticket-detailed"></i> Chamados</h3>
    <div>
      <button id="btnNewTicket" class="btn btn-primary btn-sm me-2">
        <i class="bi bi-plus-lg"></i> Novo Chamado
      </button>
      <button id="btnUserRegister" class="btn btn-success btn-sm d-none">
        <i class="bi bi-person-plus"></i> Cadastrar Usuário
      </button>
    </div>
  </div>

  <div class="card p-3 mb-4 shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped align-middle text-center">
        <thead>
          <tr>
            <th>Assunto</th>
            <th>Cliente</th>
            <th>Descrição</th>
            <th>Técnico</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="d-flex gap-2 mb-5">
    <button id="btnOperators" class="btn btn-info btn-sm"><i class="bi bi-people"></i> Técnicos</button>
    <button id="btnReport" class="btn btn-warning btn-sm"><i class="bi bi-file-earmark-bar-graph"></i> Relatórios</button>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <p>© 2025 Sistema de Chamados - Desenvolvido com ❤️ por Eduardo Lima</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBA16WHE768N9eUcqEoQqUF7uEIB82nNM0",
    authDomain: "chamados-37b34.firebaseapp.com",
    projectId: "chamados-37b34",
    storageBucket: "chamados-37b34.firebasestorage.app",
    messagingSenderId: "164935126006",
    appId: "1:164935126006:web:e49fd19961993d5b62d5d7"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginContainer = document.getElementById("loginContainer");
  const mainContainer = document.getElementById("mainContainer");
  const ticketTableBody = document.getElementById("ticketTableBody");
  const btnUserRegister = document.getElementById("btnUserRegister");
  const themeToggle = document.getElementById("themeToggle");

  let currentUser = null;
  let tickets = [];

  // LOGIN
  loginBtn.addEventListener("click", async () => {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    if (!user || !pass) return alert("Preencha todos os campos!");
    const snapshot = await db.collection("users")
      .where("login", "==", user)
      .where("password", "==", pass)
      .get();
    if (snapshot.empty) return alert("Usuário ou senha incorretos!");
    currentUser = snapshot.docs[0].data();
    loginContainer.classList.add("d-none");
    mainContainer.classList.remove("d-none");
    logoutBtn.classList.remove("d-none");
    if (currentUser.role == "admin") btnUserRegister.classList.remove("d-none");
    carregarChamados();
  });

  // LOGOUT
  logoutBtn.addEventListener("click", () => {
    currentUser = null;
    loginContainer.classList.remove("d-none");
    mainContainer.classList.add("d-none");
    logoutBtn.classList.add("d-none");
  });

  // CARREGAR CHAMADOS
  async function carregarChamados() {
    ticketTableBody.innerHTML = "<tr><td colspan='8'>Carregando...</td></tr>";
    const snapshot = await db.collection("tickets").orderBy("date", "asc").get();
    tickets = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTickets();
  }

  function renderTickets() {
    ticketTableBody.innerHTML = "";
    if (tickets.length == 0) {
      ticketTableBody.innerHTML = "<tr><td colspan='8'>Nenhum chamado.</td></tr>";
      return;
    }
    tickets.forEach(t => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${t.subject}</td>
        <td>${t.client}</td>
        <td>${t.description}</td>
        <td>${t.tech}</td>
        <td>${t.priority}</td>
        <td>${t.status}</td>
        <td>${new Date(t.date).toLocaleString()}</td>
        <td>
          <button class="btn btn-primary btn-sm">Detalhes</button>
          ${currentUser && currentUser.role === "admin" && t.status !== "Encerrado" ?
            `<button class="btn btn-success btn-sm ms-1" onclick="encerrarChamado('${t.id}')">Encerrar</button>` : ""}
        </td>`;
      ticketTableBody.appendChild(row);
    });
  }

  // ENCERRAR CHAMADO
  window.encerrarChamado = async function (id) {
    if (!confirm("Deseja encerrar este chamado?")) return;
    await db.collection("tickets").doc(id).update({ status: "Encerrado" });
    alert("Chamado encerrado!");
    carregarChamados();
  };

  // ====== TEMA CLARO / ESCURO ======
  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute("data-theme");
    if (currentTheme === "dark") {
      document.documentElement.removeAttribute("data-theme");
      themeToggle.innerHTML = '<i class="bi bi-moon-fill"></i>';
      localStorage.setItem("theme", "light");
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      themeToggle.innerHTML = '<i class="bi bi-sun-fill"></i>';
      localStorage.setItem("theme", "dark");
    }
  }

  themeToggle.addEventListener("click", toggleTheme);

  // Mantém o tema escolhido
  window.addEventListener("DOMContentLoaded", () => {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      themeToggle.innerHTML = '<i class="bi bi-sun-fill"></i>';
    }
  });
</script>
</body>
</html>
