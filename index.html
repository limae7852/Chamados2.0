<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Chamados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body { background-color:#121212; color:#f5f5f5; }
  .card{background-color:#1e1e1e; border:1px solid #333;}
  .navbar{background-color:#212121 !important;}
  .table-dark tbody tr td{vertical-align:middle;}
  .modal-content{background-color:#1e1e1e; color:#f5f5f5;}
  .btn-edit{background-color:#facc15;color:#000;padding:0.25rem 0.5rem;border-radius:0.25rem;}
  .btn-edit:hover{background-color:#eab308;}
  .btn-close{background-color:#ef4444;color:#fff;padding:0.25rem 0.5rem;border-radius:0.25rem;}
  .btn-close:hover{background-color:#b91c1c;}
  .btn-details{background-color:#3b82f6;color:#fff;padding:0.25rem 0.5rem;border-radius:0.25rem;}
  .btn-details:hover{background-color:#1d4ed8;}
</style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Painel de Chamados</span>
    <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none">Sair</button>
  </div>
</nav>

<!-- Login -->
<div class="container" id="loginContainer">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow">
        <h4 class="text-center mb-3">Login</h4>
        <div class="mb-3"><label class="form-label">Usuário</label><input type="text" class="form-control" id="loginUser"></div>
        <div class="mb-3"><label class="form-label">Senha</label><input type="password" class="form-control" id="loginPass"></div>
        <button class="btn btn-primary w-100" id="loginBtn">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Sistema -->
<div class="container d-none" id="mainContainer">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-ticket-detailed"></i> Chamados</h3>
    <div>
      <button id="btnNewTicket" class="btn btn-success btn-sm me-2 d-none"><i class="bi bi-plus-circle"></i> Novo Chamado</button>
      <button id="btnUserRegister" class="btn btn-warning btn-sm d-none"><i class="bi bi-person-plus"></i> Cadastrar Usuário</button>
    </div>
  </div>

  <div class="table-responsive mb-3">
    <table class="table table-dark table-striped align-middle">
      <thead>
        <tr>
          <th>Assunto</th>
          <th>Cliente</th>
          <th>Descrição</th>
          <th>Técnico</th>
          <th>Prioridade</th>
          <th>Status</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="ticketTableBody"></tbody>
    </table>
  </div>

  <div class="mb-4">
    <button id="btnOperators" class="btn btn-info btn-sm">Gerenciar Operadores</button>
    <button id="btnReport" class="btn btn-warning btn-sm">Relatório PDF/Excel</button>
  </div>
</div>

<!-- Modal Novo Chamado -->
<div class="modal fade" id="newTicketModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <div class="d-flex justify-content-between mb-2">
        <h5 class="modal-title">Novo Chamado</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="ticketForm">
        <div class="mb-2"><input class="form-control" id="ticketSubject" placeholder="Assunto" required></div>
        <div class="mb-2"><input class="form-control" id="ticketClient" placeholder="Cliente" required></div>
        <div class="mb-2"><textarea class="form-control" id="ticketDescription" placeholder="Descrição" required></textarea></div>
        <div class="mb-2"><select id="ticketTech" class="form-control" required><option value="">Selecione o Técnico</option></select></div>
        <div class="mb-2"><select id="ticketPriority" class="form-control">
          <option value="Baixa">Baixa</option><option value="Média">Média</option><option value="Alta">Alta</option>
        </select></div>
        <div class="mb-2"><select id="ticketStatus" class="form-control">
          <option value="Aberto">Aberto</option><option value="Em andamento">Em andamento</option><option value="Resolvido">Resolvido</option>
        </select></div>
        <button class="btn btn-success w-100" type="submit">Salvar</button>
      </form>
    </div>
  </div>
</div>

<!-- Firebase + Lógica -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBA16WHE768N9eUcqEoQqUF7uEIB82nNM0",
  authDomain: "chamados-37b34.firebaseapp.com",
  projectId: "chamados-37b34",
  storageBucket: "chamados-37b34.firebasestorage.app",
  messagingSenderId: "164935126006",
  appId: "1:164935126006:web:e49fd19961993d5b62d5d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginContainer = document.getElementById("loginContainer");
const mainContainer = document.getElementById("mainContainer");
const ticketTableBody = document.getElementById("ticketTableBody");
const btnUserRegister = document.getElementById("btnUserRegister");
const btnNewTicket = document.getElementById("btnNewTicket");

let currentUser = null;
let tickets = [];

// === LOGIN ===
loginBtn.addEventListener("click", async ()=>{
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  if(!user||!pass){alert("Preencha todos os campos!"); return;}
  const snapshot = await db.collection("users").where("login","==",user).where("password","==",pass).get();
  if(snapshot.empty){alert("Usuário ou senha incorretos!"); return;}
  currentUser = snapshot.docs[0].data();
  loginContainer.classList.add("d-none");
  mainContainer.classList.remove("d-none");
  logoutBtn.classList.remove("d-none");
  if(currentUser.role=="admin"){
    btnUserRegister.classList.remove("d-none");
    btnNewTicket.classList.remove("d-none");
  }
  carregarChamados();
});

// === LOGOUT ===
logoutBtn.addEventListener("click",()=>{
  currentUser=null;
  loginContainer.classList.remove("d-none");
  mainContainer.classList.add("d-none");
  logoutBtn.classList.add("d-none");
});

// === CARREGAR CHAMADOS ===
async function carregarChamados(){
  ticketTableBody.innerHTML="<tr><td colspan='8' class='text-center'>Carregando...</td></tr>";
  const snapshot = await db.collection("tickets").orderBy("date","asc").get();
  tickets = snapshot.docs.map(d=>({id:d.id,...d.data()}));
  renderTickets();
}

function renderTickets(){
  if(tickets.length==0){ticketTableBody.innerHTML="<tr><td colspan='8'>Nenhum chamado.</td></tr>"; return;}
  ticketTableBody.innerHTML="";
  tickets.forEach(t=>{
    const row = document.createElement("tr");
    let actionBtns = `<button class='btn-details btn btn-sm' onclick="showDetails('${t.id}')">Detalhes</button>`;
    if(currentUser && currentUser.role==="admin"){
      actionBtns += `
        <button class='btn-edit btn btn-sm' onclick="editTicket('${t.id}')">Editar</button>
        <button class='btn-close btn btn-sm' onclick="deleteTicket('${t.id}')">Excluir</button>`;
    }
    row.innerHTML = `
      <td>${t.subject||"-"}</td>
      <td>${t.client||"-"}</td>
      <td>${t.description||"-"}</td>
      <td>${t.tech||"-"}</td>
      <td>${t.priority||"-"}</td>
      <td>${t.status||"-"}</td>
      <td>${new Date(t.date).toLocaleString()}</td>
      <td>${actionBtns}</td>`;
    ticketTableBody.appendChild(row);
  });
}

// === NOVO CHAMADO ===
const newTicketModal = new bootstrap.Modal(document.getElementById("newTicketModal"));
btnNewTicket.addEventListener("click",()=>{fetchOperators(); newTicketModal.show();});

document.getElementById("ticketForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const ticket = {
    subject: ticketSubject.value,
    client: ticketClient.value,
    description: ticketDescription.value,
    tech: ticketTech.value,
    priority: ticketPriority.value,
    status: ticketStatus.value,
    date: new Date().toISOString()
  };
  await db.collection("tickets").add(ticket);
  e.target.reset();
  newTicketModal.hide();
  carregarChamados();
});

// === EDITAR E EXCLUIR ===
window.editTicket = async function(id){
  const t = tickets.find(tt=>tt.id==id);
  if(!t) return;
  document.getElementById("ticketSubject").value=t.subject;
  document.getElementById("ticketClient").value=t.client;
  document.getElementById("ticketDescription").value=t.description;
  document.getElementById("ticketTech").value=t.tech;
  document.getElementById("ticketPriority").value=t.priority;
  document.getElementById("ticketStatus").value=t.status;
  newTicketModal.show();
  document.getElementById("ticketForm").onsubmit = async e=>{
    e.preventDefault();
    await db.collection("tickets").doc(id).update({
      subject: ticketSubject.value,
      client: ticketClient.value,
      description: ticketDescription.value,
      tech: ticketTech.value,
      priority: ticketPriority.value,
      status: ticketStatus.value
    });
    newTicketModal.hide();
    carregarChamados();
  };
};

window.deleteTicket = async function(id){
  if(confirm("Deseja excluir este chamado?")){
    await db.collection("tickets").doc(id).delete();
    carregarChamados();
  }
};

// === OPERADORES ===
async function fetchOperators(){
  const snapshot = await db.collection("operators").get();
  const techSelect = document.getElementById("ticketTech");
  techSelect.innerHTML="<option value=''>Selecione o Técnico</option>";
  snapshot.forEach(doc=>{
    const op = doc.data();
    techSelect.innerHTML += `<option value="${op.name}">${op.name}</option>`;
  });
}
</script>
</body>
</html>
