<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Chamados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body {
    background-color: #f1f5f9;
    color: #212529;
    font-family: "Segoe UI", Roboto, sans-serif;
  }

  .navbar {
    background: linear-gradient(90deg, #0d6efd, #0a58ca);
    color: #fff !important;
  }

  .navbar .navbar-brand {
    color: #fff !important;
    font-weight: 600;
  }

  .card {
    border: none;
    border-radius: 0.75rem;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
  }

  .table-dark {
    --bs-table-bg: #ffffff;
    --bs-table-striped-bg: #f8fafc;
    --bs-table-striped-color: #212529;
    color: #212529;
    border-color: #e2e8f0;
  }

  .table thead th {
    background-color: #e9ecef;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }

  .btn {
    border-radius: 0.4rem;
    font-weight: 500;
  }

  .btn-primary {
    background-color: #0d6efd;
    border: none;
  }
  .btn-primary:hover {
    background-color: #0b5ed7;
  }

  .btn-success {
    background-color: #198754;
    border: none;
  }

  .btn-success:hover {
    background-color: #157347;
  }

  .btn-warning {
    background-color: #ffc107;
    border: none;
    color: #212529;
  }

  .btn-warning:hover {
    background-color: #e0a800;
  }

  .btn-info {
    background-color: #0dcaf0;
    border: none;
    color: #212529;
  }

  .btn-info:hover {
    background-color: #31d2f2;
  }

  .modal-content {
    border-radius: 0.75rem;
    border: none;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  .modal-header, .modal-title {
    font-weight: 600;
  }

  .form-control, .form-select {
    border-radius: 0.5rem;
  }

  .btn-details {
    background-color: #0d6efd;
    color: #fff;
    border: none;
  }
  .btn-details:hover {
    background-color: #0b5ed7;
  }

  .btn-edit {
    background-color: #facc15;
    color: #000;
  }
  .btn-edit:hover {
    background-color: #eab308;
  }

  .btn-end {
    background-color: #198754;
    color: #fff;
  }
  .btn-end:hover {
    background-color: #157347;
  }

  .btn-close {
    background-color: #ef4444;
    color: #fff;
  }
  .btn-close:hover {
    background-color: #dc2626;
  }

  .list-group-item.bg-dark {
    background-color: #f8f9fa !important;
    color: #212529 !important;
  }

  #loginContainer {
    margin-top: 10vh;
  }

  #mainContainer {
    animation: fadeIn 0.4s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  footer {
    text-align: center;
    padding: 10px;
    color: #6c757d;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid px-4">
    <span class="navbar-brand"><i class="bi bi-headset"></i> Sistema de Chamados</span>
    <button id="logoutBtn" class="btn btn-light btn-sm d-none"><i class="bi bi-box-arrow-right"></i> Sair</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="container" id="loginContainer">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow-sm mt-5">
        <h4 class="text-center mb-3 text-primary"><i class="bi bi-person-circle"></i> Login</h4>
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input type="text" class="form-control" id="loginUser" placeholder="Digite seu login">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="loginPass" placeholder="Digite sua senha">
        </div>
        <button class="btn btn-primary w-100" id="loginBtn">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- SISTEMA -->
<div class="container d-none" id="mainContainer">

  <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
    <h3 class="text-primary"><i class="bi bi-ticket-detailed"></i> Chamados</h3>
    <div>
      <button id="btnNewTicket" class="btn btn-primary btn-sm me-2">
        <i class="bi bi-plus-lg"></i> Novo Chamado
      </button>
      <button id="btnUserRegister" class="btn btn-success btn-sm d-none">
        <i class="bi bi-person-plus"></i> Cadastrar Usuário
      </button>
    </div>
  </div>

  <div class="card p-3 mb-4 shadow-sm">
    <div class="table-responsive">
      <table class="table table-dark table-striped align-middle text-center">
        <thead>
          <tr>
            <th>Assunto</th>
            <th>Cliente</th>
            <th>Descrição</th>
            <th>Técnico</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="d-flex gap-2 mb-5">
    <button id="btnOperators" class="btn btn-info btn-sm"><i class="bi bi-people"></i> Gerenciar Técnicos</button>
    <button id="btnReport" class="btn btn-warning btn-sm"><i class="bi bi-file-earmark-bar-graph"></i> Relatório PDF/Excel</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // === FIREBASE ===
  const firebaseConfig = {
    apiKey: "AIzaSyBA16WHE768N9eUcqEoQqUF7uEIB82nNM0",
    authDomain: "chamados-37b34.firebaseapp.com",
    projectId: "chamados-37b34",
    storageBucket: "chamados-37b34.firebasestorage.app",
    messagingSenderId: "164935126006",
    appId: "1:164935126006:web:e49fd19961993d5b62d5d7"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginContainer = document.getElementById("loginContainer");
  const mainContainer = document.getElementById("mainContainer");
  const ticketTableBody = document.getElementById("ticketTableBody");
  const btnUserRegister = document.getElementById("btnUserRegister");

  let currentUser = null;
  let tickets = [];

  // LOGIN
  loginBtn.addEventListener("click", async () => {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    if(!user||!pass){alert("Preencha todos os campos!"); return;}
    const snapshot = await db.collection("users").where("login","==",user).where("password","==",pass).get();
    if(snapshot.empty){alert("Usuário ou senha incorretos!"); return;}
    currentUser = snapshot.docs[0].data();
    loginContainer.classList.add("d-none");
    mainContainer.classList.remove("d-none");
    logoutBtn.classList.remove("d-none");
    if(currentUser.role=="admin") btnUserRegister.classList.remove("d-none");
    carregarChamados();
  });

  // LOGOUT
  logoutBtn.addEventListener("click", ()=>{
    currentUser=null;
    loginContainer.classList.remove("d-none");
    mainContainer.classList.add("d-none");
    logoutBtn.classList.add("d-none");
  });

  // CARREGAR CHAMADOS
  async function carregarChamados(){
    ticketTableBody.innerHTML="<tr><td colspan='8' class='text-center'>Carregando...</td></tr>";
    const snapshot = await db.collection("tickets").orderBy("date","asc").get();
    tickets = snapshot.docs.map(d=>({id:d.id,...d.data()}));
    renderTickets();
  }

  function renderTickets(){
    if(tickets.length==0){ticketTableBody.innerHTML="<tr><td colspan='8'>Nenhum chamado.</td></tr>"; return;}
    ticketTableBody.innerHTML="";
    tickets.forEach(t=>{
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${t.subject||"-"}</td>
        <td>${t.client||"-"}</td>
        <td>${t.description||"-"}</td>
        <td>${t.tech||"-"}</td>
        <td>${t.priority||"-"}</td>
        <td>${t.status||"-"}</td>
        <td>${new Date(t.date).toLocaleString()}</td>
        <td>
          <button class="btn-details btn btn-sm" onclick="showDetails('${t.id}')">Detalhes</button>
          ${currentUser && currentUser.role=="admin" && t.status!=="Encerrado" 
            ? `<button class="btn-end btn btn-sm ms-1" onclick="encerrarChamado('${t.id}')"><i class='bi bi-check2-circle'></i> Encerrar</button>` 
            : ""}
        </td>
      `;
      ticketTableBody.appendChild(row);
    });
  }

  // ENCERRAR CHAMADO
  window.encerrarChamado = async function(id){
    if(!confirm("Deseja realmente encerrar este chamado?")) return;
    await db.collection("tickets").doc(id).update({status:"Encerrado"});
    alert("Chamado encerrado com sucesso!");
    carregarChamados();
  }

  // DETALHES
  window.showDetails = async function(id){
    const ticket = tickets.find(t=>t.id==id);
    if(!ticket) return;
    const content = document.getElementById("reportContent");
    content.innerHTML = `
      <p><strong>Assunto:</strong> ${ticket.subject}</p>
      <p><strong>Cliente:</strong> ${ticket.client}</p>
      <p><strong>Descrição:</strong> ${ticket.description}</p>
      <p><strong>Técnico:</strong> ${ticket.tech}</p>
      <p><strong>Prioridade:</strong> ${ticket.priority}</p>
      <p><strong>Status:</strong> ${ticket.status}</p>
      <p><strong>Data:</strong> ${new Date(ticket.date).toLocaleString()}</p>
    `;
    const reportModal = new bootstrap.Modal(document.getElementById("reportModal"));
    reportModal.show();
  }

  // RELATÓRIO PDF / EXCEL
  function downloadPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y=10;
    doc.text("Relatório de Chamados",10,y); y+=10;
    tickets.forEach(t=>{
      doc.text(`Assunto: ${t.subject}`,10,y); y+=6;
      doc.text(`Cliente: ${t.client}`,10,y); y+=6;
      doc.text(`Descrição: ${t.description}`,10,y); y+=6;
      doc.text(`Técnico: ${t.tech}`,10,y); y+=6;
      doc.text(`Prioridade: ${t.priority}`,10,y); y+=6;
      doc.text(`Status: ${t.status}`,10,y); y+=6;
      doc.text(`Data: ${new Date(t.date).toLocaleString()}`,10,y); y+=10;
    });
    doc.save("relatorio_chamados.pdf");
  }

  function downloadExcel(){
    const wb = XLSX.utils.book_new();
    const ws_data=[["Assunto","Cliente","Descrição","Técnico","Prioridade","Status","Data"]];
    tickets.forEach(t=>ws_data.push([t.subject,t.client,t.description,t.tech,t.priority,t.status,new Date(t.date).toLocaleString()]));
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb,ws,"Chamados");
    XLSX.writeFile(wb,"relatorio_chamados.xlsx");
  }

  // USUÁRIOS
  const userModal = new bootstrap.Modal(document.getElementById("userModal"));
  btnUserRegister.addEventListener("click",()=>{fetchUsers();userModal.show();});
  document.getElementById("userForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const newUser = {
      name: document.getElementById("userName").value,
      login: document.getElementById("userLogin").value,
      password: document.getElementById("userPass").value,
      role: document.getElementById("userRole").value
    };
    await db.collection("users").add(newUser);
    e.target.reset();
    fetchUsers();
  });
  async function fetchUsers(){
    const snapshot = await db.collection("users").get();
    const ul = document.getElementById("usersList"); ul.innerHTML="";
    snapshot.forEach(doc=>{
      const u = doc.data();
      const li = document.createElement("li");
      li.className="list-group-item bg-dark text-white";
      li.textContent = `${u.name} (${u.login}) - ${u.role}`;
      ul.appendChild(li);
    });
  }

  // OPERADORES
  const operatorsModal = new bootstrap.Modal(document.getElementById("operatorsModal"));
  document.getElementById("btnOperators").addEventListener("click",()=>{fetchOperators();operatorsModal.show();});
  const operatorsList = document.getElementById("operatorsList");
  document.getElementById("addOperatorBtn").addEventListener("click",async ()=>{
    const name = document.getElementById("newOperator").value.trim();
    if(!name) return;
    await db.collection("operators").add({name});
    document.getElementById("newOperator").value="";
    fetchOperators();
  });
  async function fetchOperators(){
    const snapshot = await db.collection("operators").get();
    operatorsList.innerHTML="";
    snapshot.forEach(doc=>{
      const li=document.createElement("li");
      li.className="list-group-item bg-dark text-black";
      li.textContent=doc.data().name;
      operatorsList.appendChild(li);
    });
  }

  // NOVO CHAMADO
  const newTicketModal = new bootstrap.Modal(document.getElementById("newTicketModal"));
  document.getElementById("btnNewTicket").addEventListener("click",()=>{
    fetchOperators();
    newTicketModal.show();
  });
  document.getElementById("ticketForm").addEventListener("submit",async e=>{
    e.preventDefault();
    await db.collection("tickets").add({
      subject: document.getElementById("ticketSubject").value,
      client: document.getElementById("ticketClient").value,
      description: document.getElementById("ticketDescription").value,
      tech: document.getElementById("ticketTech").value,
      priority: document.getElementById("ticketPriority").value,
      status: document.getElementById("ticketStatus").value,
      date: new Date().getTime()
    });
    e.target.reset();
    newTicketModal.hide();
    carregarChamados();
  });

  // CARREGAR TÉCNICOS NO SELECT
  async function fetchTechs(){
    const snapshot = await db.collection("operators").get();
    const techSelect = document.getElementById("ticketTech");
    techSelect.innerHTML='<option value="">Selecione o Técnico</option>';
    snapshot.forEach(doc=>{
      const opt = document.createElement("option");
      opt.value = doc.data().name;
      opt.textContent = doc.data().name;
      techSelect.appendChild(opt);
    });
  }
  fetchTechs();
</script>

</body>
</html>
