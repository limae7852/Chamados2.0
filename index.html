<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Chamados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body { background-color:#f8f9fa; color:#212529; }
  .navbar { background-color:#0d6efd !important; }
  .navbar .navbar-brand { color:#fff !important; font-weight:600; }
  .card { border-radius:0.75rem; }
  .btn-edit { background-color:#ffc107; color:#000; }
  .btn-end { background-color:#198754; color:#fff; }
  .btn-details { background-color:#0d6efd; color:#fff; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Painel de Chamados</span>
    <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none">Sair</button>
  </div>
</nav>

<!-- Login -->
<div class="container" id="loginContainer">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow-sm">
        <h4 class="text-center mb-3">Login</h4>
        <div class="mb-3"><label class="form-label">Usuário</label><input type="text" class="form-control" id="loginUser"></div>
        <div class="mb-3"><label class="form-label">Senha</label><input type="password" class="form-control" id="loginPass"></div>
        <button class="btn btn-primary w-100" id="loginBtn">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Sistema -->
<div class="container d-none" id="mainContainer">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-ticket-detailed"></i> Chamados</h3>
    <div>
      <button id="btnNewTicket" class="btn btn-primary btn-sm me-2">
        <i class="bi bi-plus-lg"></i> Novo Chamado
      </button>
      <button id="btnUserRegister" class="btn btn-success btn-sm d-none">Cadastrar Usuário</button>
    </div>
  </div>

  <div class="table-responsive mb-3">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-primary">
        <tr>
          <th>Assunto</th>
          <th>Cliente</th>
          <th>Descrição</th>
          <th>Técnico</th>
          <th>Prioridade</th>
          <th>Status</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="ticketTableBody"></tbody>
    </table>
  </div>

</div>

<!-- Modal Novo/Editar Chamado -->
<div class="modal fade" id="ticketModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">
      <div class="d-flex justify-content-between mb-2">
        <h5 class="modal-title" id="ticketModalTitle">Novo Chamado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="ticketForm">
        <input type="hidden" id="ticketId">
        <div class="row">
          <div class="col-md-6 mb-2">
            <input class="form-control" id="ticketSubject" placeholder="Assunto" required>
          </div>
          <div class="col-md-6 mb-2">
            <input class="form-control" id="ticketClient" placeholder="Cliente" required>
          </div>
          <div class="col-12 mb-2">
            <textarea class="form-control" id="ticketDescription" placeholder="Descrição" required></textarea>
          </div>
          <div class="col-md-4 mb-2">
            <input class="form-control" id="ticketTech" placeholder="Técnico" required>
          </div>
          <div class="col-md-4 mb-2">
            <select id="ticketPriority" class="form-select" required>
              <option value="Baixa">Baixa</option>
              <option value="Média">Média</option>
              <option value="Alta">Alta</option>
            </select>
          </div>
          <div class="col-md-4 mb-2">
            <select id="ticketStatus" class="form-select" required>
              <option value="Aberto">Aberto</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Resolvido">Resolvido</option>
              <option value="Encerrado">Encerrado</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Salvar</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // === FIREBASE ===
  const firebaseConfig = {
    apiKey: "AIzaSyBA16WHE768N9eUcqEoQqUF7uEIB82nNM0",
    authDomain: "chamados-37b34.firebaseapp.com",
    projectId: "chamados-37b34",
    storageBucket: "chamados-37b34.firebasestorage.app",
    messagingSenderId: "164935126006",
    appId: "1:164935126006:web:e49fd19961993d5b62d5d7"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginContainer = document.getElementById("loginContainer");
  const mainContainer = document.getElementById("mainContainer");
  const ticketTableBody = document.getElementById("ticketTableBody");
  const btnUserRegister = document.getElementById("btnUserRegister");

  let currentUser = null;
  let tickets = [];

  // LOGIN
  loginBtn.addEventListener("click", async () => {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    if(!user||!pass){alert("Preencha todos os campos!"); return;}
    const snapshot = await db.collection("users").where("login","==",user).where("password","==",pass).get();
    if(snapshot.empty){alert("Usuário ou senha incorretos!"); return;}
    currentUser = snapshot.docs[0].data();
    loginContainer.classList.add("d-none");
    mainContainer.classList.remove("d-none");
    logoutBtn.classList.remove("d-none");
    carregarChamados();
  });

  // LOGOUT
  logoutBtn.addEventListener("click", ()=>{
    currentUser=null;
    loginContainer.classList.remove("d-none");
    mainContainer.classList.add("d-none");
    logoutBtn.classList.add("d-none");
  });

  // CARREGAR CHAMADOS
  async function carregarChamados(){
    ticketTableBody.innerHTML="<tr><td colspan='8' class='text-center'>Carregando...</td></tr>";
    const snapshot = await db.collection("tickets").orderBy("date","asc").get();
    tickets = snapshot.docs.map(d=>({id:d.id,...d.data()}));
    renderTickets();
  }

  function renderTickets(){
    if(tickets.length==0){ticketTableBody.innerHTML="<tr><td colspan='8'>Nenhum chamado.</td></tr>"; return;}
    ticketTableBody.innerHTML="";
    tickets.forEach(t=>{
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${t.subject||"-"}</td>
        <td>${t.client||"-"}</td>
        <td>${t.description||"-"}</td>
        <td>${t.tech||"-"}</td>
        <td>${t.priority||"-"}</td>
        <td>${t.status||"-"}</td>
        <td>${new Date(t.date).toLocaleString()}</td>
        <td>
          ${currentUser && currentUser.role=="admin" 
            ? `<button class="btn btn-sm btn-edit me-1" onclick="editarChamado('${t.id}')"><i class='bi bi-pencil'></i></button>` 
            : ""}
        </td>
      `;
      ticketTableBody.appendChild(row);
    });
  }

  // === EDITAR CHAMADO ===
  window.editarChamado = async function(id){
    const ticket = tickets.find(t=>t.id==id);
    if(!ticket) return;
    document.getElementById("ticketId").value = ticket.id;
    document.getElementById("ticketSubject").value = ticket.subject;
    document.getElementById("ticketClient").value = ticket.client;
    document.getElementById("ticketDescription").value = ticket.description;
    document.getElementById("ticketTech").value = ticket.tech;
    document.getElementById("ticketPriority").value = ticket.priority;
    document.getElementById("ticketStatus").value = ticket.status;
    document.getElementById("ticketModalTitle").textContent = "Editar Chamado";
    new bootstrap.Modal(document.getElementById("ticketModal")).show();
  };

  // === SALVAR CHAMADO (NOVO/EDITAR) ===
  document.getElementById("ticketForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const id = document.getElementById("ticketId").value;
    const data = {
      subject: ticketSubject.value,
      client: ticketClient.value,
      description: ticketDescription.value,
      tech: ticketTech.value,
      priority: ticketPriority.value,
      status: ticketStatus.value,
      date: id ? tickets.find(t=>t.id==id).date : Date.now()
    };
    if(id){
      await db.collection("tickets").doc(id).update(data);
      alert("Chamado atualizado com sucesso!");
    } else {
      await db.collection("tickets").add(data);
      alert("Chamado criado com sucesso!");
    }
    bootstrap.Modal.getInstance(document.getElementById("ticketModal")).hide();
    carregarChamados();
  });

  // NOVO CHAMADO
  document.getElementById("btnNewTicket").addEventListener("click",()=>{
    document.getElementById("ticketForm").reset();
    document.getElementById("ticketId").value="";
    document.getElementById("ticketModalTitle").textContent="Novo Chamado";
    new bootstrap.Modal(document.getElementById("ticketModal")).show();
  });

</script>

</body>
</html>
