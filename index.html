<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GateGuard - Controle de Entrada/Saída</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Firebase compat (Firestore compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { background:#f4f6fb; color:#0f172a; font-family: Inter, system-ui, sans-serif; }
    .card { border-radius: .75rem; box-shadow: 0 8px 30px rgba(10,15,30,0.06); }
    .table thead th { background:#eef2ff; }
    .small-muted { font-size:.85rem; color:#6b7280; }
    footer { text-align:center; padding:12px; color:#6b7280; }
    .badge-present { background:#10b981; color:#fff; }
    .badge-left { background:#6b7280; color:#fff; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg,#0d6efd,#0a58ca);">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="#"><i class="bi bi-door-open-fill"></i> GateGuard</a>
    <div class="d-flex gap-2">
      <button id="btnNew" class="btn btn-light btn-sm"><i class="bi bi-plus-lg"></i> Novo Registro</button>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="row g-3">
    <div class="col-lg-4">
      <div class="card p-3">
        <h5 class="mb-3">Filtros</h5>
        <div class="mb-2">
          <label class="form-label small-muted">Nome</label>
          <input id="filterName" class="form-control" placeholder="Pesquisar por nome">
        </div>
        <div class="mb-2">
          <label class="form-label small-muted">Placa</label>
          <input id="filterPlate" class="form-control" placeholder="Pesquisar por placa">
        </div>
        <div class="mb-2">
          <label class="form-label small-muted">Motivo</label>
          <input id="filterReason" class="form-control" placeholder="Pesquisar por motivo">
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label small-muted">De (entrada)</label>
            <input id="filterFrom" type="date" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label small-muted">Até (entrada)</label>
            <input id="filterTo" type="date" class="form-control">
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button id="btnApplyFilters" class="btn btn-primary btn-sm">Aplicar</button>
          <button id="btnClearFilters" class="btn btn-outline-secondary btn-sm">Limpar</button>
        </div>
        <hr class="my-3">
        <div>
          <p class="small-muted mb-1">Mostrar</p>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="filterShow" id="showAll" value="all" checked>
            <label class="form-check-label" for="showAll">Todos</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="filterShow" id="showPresent" value="present">
            <label class="form-check-label" for="showPresent">Presentes</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="filterShow" id="showLeft" value="left">
            <label class="form-check-label" for="showLeft">Saiu</label>
          </div>
        </div>
      </div>
      <div class="card p-3 mt-3">
        <h6 class="mb-2">Controles</h6>
        <div class="d-flex gap-2">
          <button id="btnRefresh" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-clockwise"></i> Atualizar</button>
          <button id="btnExportCsv" class="btn btn-outline-success btn-sm"><i class="bi bi-file-earmark-spreadsheet"></i> CSV</button>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <h5>Registros</h5>
            <div class="small-muted">Registros de entrada e saída</div>
          </div>
          <div class="small-muted" id="totalCount">— registros</div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr class="text-center">
                <th>Nome</th>
                <th>Empresa</th>
                <th>Placa</th>
                <th>Motivo</th>
                <th>Entrada</th>
                <th>Saída</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="recordsBody">
              <!-- preenchido via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <small>© 2025 GateGuard - Desenvolvido por você</small>
</footer>

<!-- Modal: Novo / Editar Registro -->
<div class="modal fade" id="recordModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 id="recordModalTitle">Novo Registro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="recordForm">
        <input type="hidden" id="recordId" value="">
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Nome</label>
            <input id="inputName" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Empresa</label>
            <input id="inputCompany" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Placa do Veículo</label>
            <input id="inputPlate" class="form-control" placeholder="AAA0A00 / ABC-1234">
          </div>
          <div class="col-md-6">
            <label class="form-label">Motivo</label>
            <input id="inputReason" class="form-control" placeholder="Motivo da visita (ex.: Entrega, Reunião)">
          </div>
          <div class="col-12">
            <label class="form-label">Observações</label>
            <textarea id="inputNotes" class="form-control" rows="2" placeholder="Observações (opcional)"></textarea>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-primary" type="submit" id="saveRecordBtn"><i class="bi bi-save"></i> Salvar</button>
          <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =========================
   CONFIGURAÇÃO FIREBASE
   Substitua pelas suas credenciais, se desejar.
   ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBA16WHE768N9eUcqEoQqUF7uEIB82nNM0",
  authDomain: "chamados-37b34.firebaseapp.com",
  projectId: "chamados-37b34",
  storageBucket: "chamados-37b34.firebasestorage.app",
  messagingSenderId: "164935126006",
  appId: "1:164935126006:web:e49fd19961993d5b62d5d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   ELEMENTOS
   ========================= */
const btnNew = document.getElementById('btnNew');
const recordsBody = document.getElementById('recordsBody');
const totalCount = document.getElementById('totalCount');

const filterName = document.getElementById('filterName');
const filterPlate = document.getElementById('filterPlate');
const filterReason = document.getElementById('filterReason');
const filterFrom = document.getElementById('filterFrom');
const filterTo = document.getElementById('filterTo');
const btnApplyFilters = document.getElementById('btnApplyFilters');
const btnClearFilters = document.getElementById('btnClearFilters');
const btnRefresh = document.getElementById('btnRefresh');
const btnExportCsv = document.getElementById('btnExportCsv');

const recordModalEl = document.getElementById('recordModal');
const recordModal = new bootstrap.Modal(recordModalEl);
const recordForm = document.getElementById('recordForm');
const recordModalTitle = document.getElementById('recordModalTitle');
const inputName = document.getElementById('inputName');
const inputCompany = document.getElementById('inputCompany');
const inputPlate = document.getElementById('inputPlate');
const inputReason = document.getElementById('inputReason');
const inputNotes = document.getElementById('inputNotes');
const recordIdInput = document.getElementById('recordId');

let records = []; // cache local
let lastFetch = null;

/* =========================
   UTILITÁRIOS
   ========================= */
function formatDate(ts) {
  if (!ts) return '-';
  const d = (ts instanceof Date) ? ts : new Date(ts);
  return d.toLocaleString();
}
function escapeHtml(text){
  if(!text && text !== 0) return '';
  return String(text).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
}

/* =========================
   FUNÇÕES PRINCIPAIS
   ========================= */

/* carregar todos os registros (ordem decrescente por entryTime) */
async function loadRecords() {
  recordsBody.innerHTML = '<tr><td colspan="7" class="text-center small-muted">Carregando...</td></tr>';
  try {
    const snapshot = await db.collection('gate_records').orderBy('entryTime', 'desc').get();
    records = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    lastFetch = new Date();
    applyFiltersAndRender();
  } catch (err) {
    console.error(err);
    recordsBody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Erro ao carregar registros.</td></tr>';
  }
}

/* aplica filtros (cliente-side) e renderiza */
function applyFiltersAndRender() {
  let filtered = [...records];

  // filtro "mostrar" (presentes / saiu / all)
  const show = document.querySelector('input[name="filterShow"]:checked').value;
  if (show === 'present') filtered = filtered.filter(r => !r.exitTime);
  if (show === 'left') filtered = filtered.filter(r => !!r.exitTime);

  // texto: nome
  const nameQ = filterName.value.trim().toLowerCase();
  if (nameQ) filtered = filtered.filter(r => (r.name||'').toLowerCase().includes(nameQ));

  // placa
  const plateQ = filterPlate.value.trim().toLowerCase();
  if (plateQ) filtered = filtered.filter(r => (r.plate||'').toLowerCase().includes(plateQ));

  // motivo
  const reasonQ = filterReason.value.trim().toLowerCase();
  if (reasonQ) filtered = filtered.filter(r => (r.reason||'').toLowerCase().includes(reasonQ));

  // intervalo data (entryTime)
  const from = filterFrom.value ? new Date(filterFrom.value + 'T00:00:00') : null;
  const to = filterTo.value ? new Date(filterTo.value + 'T23:59:59') : null;
  if (from) filtered = filtered.filter(r => new Date(r.entryTime) >= from);
  if (to) filtered = filtered.filter(r => new Date(r.entryTime) <= to);

  renderRecords(filtered);
}

/* render tabela */
function renderRecords(list) {
  if (!list || list.length === 0) {
    recordsBody.innerHTML = '<tr><td colspan="7" class="text-center small-muted">Nenhum registro encontrado.</td></tr>';
    totalCount.textContent = `0 registros`;
    return;
  }
  totalCount.textContent = `${list.length} registros (ult. atualização: ${lastFetch ? lastFetch.toLocaleTimeString() : '-'})`;

  recordsBody.innerHTML = '';
  list.forEach(r => {
    const tr = document.createElement('tr');
    tr.className = r.exitTime ? '' : 'table-success'; // destaque para presentes (sem saída)
    tr.innerHTML = `
      <td>${escapeHtml(r.name || '')}</td>
      <td>${escapeHtml(r.company || '')}</td>
      <td>${escapeHtml(r.plate || '')}</td>
      <td>${escapeHtml(r.reason || '')}</td>
      <td class="text-nowrap">${formatDate(r.entryTime)}</td>
      <td class="text-nowrap">${r.exitTime ? formatDate(r.exitTime) : '<span class="badge badge-present">Presente</span>'}</td>
      <td class="text-center">
        ${!r.exitTime ? `<button class="btn btn-sm btn-success me-1" data-id="${r.id}" data-action="exit"><i class="bi bi-box-arrow-in-right"></i> Registrar Saída</button>` : ''}
        ${!r.exitTime ? `<button class="btn btn-sm btn-danger ms-1" data-id="${r.id}" data-action="delete"><i class="bi bi-trash"></i></button>` : ''}
        <button class="btn btn-sm btn-outline-primary ms-1" data-id="${r.id}" data-action="edit"><i class="bi bi-pencil"></i></button>
      </td>
    `;
    recordsBody.appendChild(tr);
  });
}

/* adicionar novo registro */
async function addRecord(payload) {
  const doc = {
    name: payload.name || '',
    company: payload.company || '',
    plate: payload.plate || '',
    reason: payload.reason || '',
    notes: payload.notes || '',
    entryTime: new Date().toISOString(),
    exitTime: null
  };
  const ref = await db.collection('gate_records').add(doc);
  // atualiza cache local imediatamente
  records.unshift({ id: ref.id, ...doc });
  applyFiltersAndRender();
}

/* atualizar registro (edição) */
async function updateRecord(id, payload) {
  await db.collection('gate_records').doc(id).update(payload);
  // atualiza cache local
  records = records.map(r => r.id === id ? { ...r, ...payload } : r);
  applyFiltersAndRender();
}

/* registrar saída -> define exitTime e remove botão excluir ao renderizar */
async function registerExit(id) {
  const nowIso = new Date().toISOString();
  await db.collection('gate_records').doc(id).update({ exitTime: nowIso });
  records = records.map(r => r.id === id ? { ...r, exitTime: nowIso } : r);
  applyFiltersAndRender();
}

/* deletar registro (permanente) - só disponível enquanto não houve saída */
async function deleteRecord(id) {
  await db.collection('gate_records').doc(id).delete();
  records = records.filter(r => r.id !== id);
  applyFiltersAndRender();
}

/* export CSV simples */
function exportCsv(list) {
  if (!list || list.length === 0) { alert('Nada para exportar.'); return; }
  const cols = ['Nome','Empresa','Placa','Motivo','Observações','Entrada','Saída'];
  const rows = list.map(r => [
    r.name || '', r.company || '', r.plate || '', r.reason || '', r.notes || '',
    r.entryTime ? new Date(r.entryTime).toLocaleString() : '',
    r.exitTime ? new Date(r.exitTime).toLocaleString() : ''
  ]);
  const csv = [cols, ...rows].map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gate_records_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* =========================
   HANDLERS / EVENTS
   ========================= */

/* abrir modal novo registro */
btnNew.addEventListener('click', () => {
  recordModalTitle.textContent = 'Novo Registro';
  recordForm.reset();
  recordIdInput.value = '';
  recordModal.show();
});

/* salvar novo / editar */
recordForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    name: inputName.value.trim(),
    company: inputCompany.value.trim(),
    plate: inputPlate.value.trim(),
    reason: inputReason.value.trim(),
    notes: inputNotes.value.trim()
  };
  const id = recordIdInput.value;
  try {
    if (!payload.name) { alert('Nome é obrigatório'); return; }
    if (id) {
      // editar existente (não altera entryTime/exitTime a menos que payload inclua)
      await updateRecord(id, payload);
      alert('Registro atualizado com sucesso!');
    } else {
      await addRecord(payload);
      alert('Registro criado com sucesso!');
    }
    recordModal.hide();
    recordForm.reset();
  } catch (err) {
    console.error(err);
    alert('Erro ao salvar registro.');
  }
});

/* delegação de eventos na tabela (exit / delete / edit) */
recordsBody.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const id = btn.getAttribute('data-id');
  const action = btn.getAttribute('data-action');
  if (!id || !action) return;

  if (action === 'exit') {
    if (!confirm('Registrar saída para este visitante?')) return;
    try {
      await registerExit(id);
      alert('Saída registrada.');
    } catch (err) {
      console.error(err);
      alert('Erro ao registrar saída.');
    }
  } else if (action === 'delete') {
    if (!confirm('Excluir permanentemente este registro?')) return;
    try {
      await deleteRecord(id);
      alert('Registro excluído.');
    } catch (err) {
      console.error(err);
      alert('Erro ao excluir registro.');
    }
  } else if (action === 'edit') {
    // abrir modal preenchido
    const rec = records.find(r => r.id === id);
    if (!rec) { alert('Registro não encontrado.'); return; }
    recordModalTitle.textContent = 'Editar Registro';
    recordIdInput.value = rec.id;
    inputName.value = rec.name || '';
    inputCompany.value = rec.company || '';
    inputPlate.value = rec.plate || '';
    inputReason.value = rec.reason || '';
    inputNotes.value = rec.notes || '';
    recordModal.show();
  }
});

/* filtros */
btnApplyFilters.addEventListener('click', () => applyFiltersAndRender());
btnClearFilters.addEventListener('click', () => {
  filterName.value = '';
  filterPlate.value = '';
  filterReason.value = '';
  filterFrom.value = '';
  filterTo.value = '';
  document.getElementById('showAll').checked = true;
  applyFiltersAndRender();
});

/* atualizar manual */
btnRefresh.addEventListener('click', () => loadRecords());

/* export CSV */
btnExportCsv.addEventListener('click', () => {
  // aplica os filtros atuais e exporta os resultados visíveis
  let filtered = [...records];
  // replicar lógica rápida (poderia chamar applyFiltersAndRender e usar cache)
  const nameQ = filterName.value.trim().toLowerCase();
  if (nameQ) filtered = filtered.filter(r => (r.name||'').toLowerCase().includes(nameQ));
  const plateQ = filterPlate.value.trim().toLowerCase();
  if (plateQ) filtered = filtered.filter(r => (r.plate||'').toLowerCase().includes(plateQ));
  const reasonQ = filterReason.value.trim().toLowerCase();
  if (reasonQ) filtered = filtered.filter(r => (r.reason||'').toLowerCase().includes(reasonQ));
  const from = filterFrom.value ? new Date(filterFrom.value + 'T00:00:00') : null;
  const to = filterTo.value ? new Date(filterTo.value + 'T23:59:59') : null;
  if (from) filtered = filtered.filter(r => new Date(r.entryTime) >= from);
  if (to) filtered = filtered.filter(r => new Date(r.entryTime) <= to);
  const show = document.querySelector('input[name="filterShow"]:checked').value;
  if (show === 'present') filtered = filtered.filter(r => !r.exitTime);
  if (show === 'left') filtered = filtered.filter(r => !!r.exitTime);

  exportCsv(filtered);
});

/* carregamento inicial */
window.addEventListener('DOMContentLoaded', () => {
  loadRecords();
});
</script>
</body>
</html>
