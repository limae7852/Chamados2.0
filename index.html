<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Chamados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --bg: #f8fafc;
    --text: #1e293b;
    --card: #ffffff;
    --border: #e2e8f0;
    --navbar: linear-gradient(90deg, #0d6efd, #0a58ca);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --text: #f8fafc;
    --card: #111827;
    --border: #334155;
    --navbar: linear-gradient(90deg, #1e40af, #1e3a8a);
  }
  body { background-color: var(--bg); color: var(--text); transition: background-color .25s, color .25s; font-family: "Segoe UI", Roboto, sans-serif; }
  .navbar { background: var(--navbar); color: #fff !important; }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: .75rem; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
  .table thead th { background-color: var(--border); }
  .btn { border-radius: .4rem; font-weight: 500; }
  .theme-toggle { background: transparent; color: #fff; border: none; font-size:1.2rem; }
  .modal-content { border-radius: .75rem; }
  #loginContainer { margin-top: 8vh; }
  footer { text-align:center; color: #6c757d; padding:10px; font-size: .85rem; }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid px-4">
    <span class="navbar-brand"><i class="bi bi-headset"></i> Sistema de Chamados</span>
    <div class="d-flex align-items-center gap-2">
      <button id="themeToggle" class="theme-toggle" title="Alterar tema"><i class="bi bi-moon-fill"></i></button>
      <button id="logoutBtn" class="btn btn-light btn-sm d-none"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </div>
</nav>

<!-- LOGIN -->
<div class="container" id="loginContainer">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow-sm mt-5">
        <h4 class="text-center mb-3 text-primary"><i class="bi bi-person-circle"></i> Login</h4>
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input type="text" class="form-control" id="loginUser" placeholder="Digite seu login">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="loginPass" placeholder="Digite sua senha">
        </div>
        <button class="btn btn-primary w-100" id="loginBtn">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="container d-none" id="mainContainer">
  <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
    <h3 class="text-primary"><i class="bi bi-ticket-detailed"></i> Chamados</h3>
    <div>
      <button id="btnNewTicket" class="btn btn-primary btn-sm me-2"><i class="bi bi-plus-lg"></i> Novo Chamado</button>
      <button id="btnUserRegister" class="btn btn-success btn-sm d-none"><i class="bi bi-person-plus"></i> Cadastrar Usuário</button>
    </div>
  </div>

  <div class="card p-3 mb-4 shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped align-middle text-center">
        <thead>
          <tr>
            <th>Assunto</th><th>Cliente</th><th>Descrição</th><th>Técnico</th>
            <th>Prioridade</th><th>Status</th><th>Data</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="d-flex gap-2 mb-5">
    <button id="btnOperators" class="btn btn-info btn-sm"><i class="bi bi-people"></i> Gerenciar Técnicos</button>
    <button id="btnReport" class="btn btn-warning btn-sm"><i class="bi bi-file-earmark-bar-graph"></i> Relatório PDF/Excel</button>
  </div>
</div>

<!-- MODAL CHAMADO -->
<div class="modal fade" id="newTicketModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="modal-title" id="ticketModalTitle">Novo Chamado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="ticketForm">
        <input type="hidden" id="editingTicketId">
        <div class="row">
          <div class="col-md-6 mb-2"><input class="form-control" id="ticketSubject" placeholder="Assunto" required></div>
          <div class="col-md-6 mb-2"><input class="form-control" id="ticketClient" placeholder="Cliente" required></div>
          <div class="col-12 mb-2"><textarea class="form-control" id="ticketDescription" placeholder="Descrição" required></textarea></div>
          <div class="col-md-4 mb-2"><select id="ticketTech" class="form-select" required><option value="">Selecione o Técnico</option></select></div>
          <div class="col-md-4 mb-2">
            <select id="ticketPriority" class="form-select" required>
              <option value="Baixa">Baixa</option>
              <option value="Média">Média</option>
              <option value="Alta">Alta</option>
            </select>
          </div>
          <div class="col-md-4 mb-2">
            <select id="ticketStatus" class="form-select" required>
              <option value="Aberto">Aberto</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Resolvido">Resolvido</option>
              <option value="Encerrado">Encerrado</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Salvar Chamado</button>
      </form>
    </div>
  </div>
</div>

<footer><p>© 2025 Sistema de Chamados - Desenvolvido por Eduardo Lima</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBA16WHE768N9eUcqEoQqUF7uEIB82nNM0",
  authDomain: "chamados-37b34.firebaseapp.com",
  projectId: "chamados-37b34",
  storageBucket: "chamados-37b34.firebasestorage.app",
  messagingSenderId: "164935126006",
  appId: "1:164935126006:web:e49fd19961993d5b62d5d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginContainer = document.getElementById("loginContainer");
const mainContainer = document.getElementById("mainContainer");
const ticketTableBody = document.getElementById("ticketTableBody");
const btnUserRegister = document.getElementById("btnUserRegister");
const btnNewTicket = document.getElementById("btnNewTicket");
const btnOperators = document.getElementById("btnOperators");
const btnReport = document.getElementById("btnReport");

const newTicketModal = new bootstrap.Modal(document.getElementById("newTicketModal"));
const userModal = new bootstrap.Modal(document.getElementById("userModal"));
const operatorsModal = new bootstrap.Modal(document.getElementById("operatorsModal"));

let currentUser = null;
let tickets = [];

/* LOGIN */
loginBtn.addEventListener("click", async ()=>{
  const user=document.getElementById("loginUser").value.trim();
  const pass=document.getElementById("loginPass").value.trim();
  if(!user||!pass) return alert("Preencha todos os campos!");
  const snap=await db.collection("users").where("login","==",user).where("password","==",pass).get();
  if(snap.empty) return alert("Usuário ou senha incorretos!");
  currentUser=snap.docs[0].data();
  loginContainer.classList.add("d-none");
  mainContainer.classList.remove("d-none");
  logoutBtn.classList.remove("d-none");
  if(currentUser.role==="admin") btnUserRegister.classList.remove("d-none");
  carregarChamados();
});

/* LOGOUT */
logoutBtn.addEventListener("click", ()=>{
  currentUser=null;
  loginContainer.classList.remove("d-none");
  mainContainer.classList.add("d-none");
  logoutBtn.classList.add("d-none");
});

/* NOVO CHAMADO */
btnNewTicket.addEventListener("click", async ()=>{
  document.getElementById("ticketModalTitle").textContent="Novo Chamado";
  document.getElementById("ticketForm").reset();
  document.getElementById("editingTicketId").value="";
  await fetchOperators();
  newTicketModal.show();
});

/* CADASTRAR USUÁRIO */
btnUserRegister.addEventListener("click", ()=>{
  document.getElementById("userForm").reset();
  userModal.show();
});

document.getElementById("userForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const data={
    name:document.getElementById("userName").value,
    login:document.getElementById("userLogin").value,
    password:document.getElementById("userPassword").value,
    role:document.getElementById("userRole").value
  };
  await db.collection("users").add(data);
  userModal.hide();
  alert("Usuário cadastrado com sucesso!");
});

/* GERENCIAR TÉCNICOS */
btnOperators.addEventListener("click", async ()=>{
  await carregarTecnicos();
  operatorsModal.show();
});

async function carregarTecnicos(){
  const tbody=document.getElementById("operatorsTableBody");
  tbody.innerHTML="<tr><td colspan='2'>Carregando...</td></tr>";
  const snap=await db.collection("operators").get();
  tbody.innerHTML="";
  if(snap.empty){
    tbody.innerHTML="<tr><td colspan='2'>Nenhum técnico cadastrado.</td></tr>";
    return;
  }
  snap.forEach(doc=>{
    const d=doc.data();
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${escapeHtml(d.name)}</td>
      <td class="text-center">
        <button class="btn btn-danger btn-sm" onclick="excluirTecnico('${doc.id}')">
          <i class="bi bi-trash"></i> Excluir
        </button>
      </td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById("addOperatorBtn").addEventListener("click", async ()=>{
  const name=document.getElementById("newOperatorName").value.trim();
  if(!name) return alert("Informe o nome do técnico!");
  await db.collection("operators").add({name});
  document.getElementById("newOperatorName").value="";
  await carregarTecnicos();
});

window.excluirTecnico=async id=>{
  if(confirm("Deseja excluir este técnico?")){
    await db.collection("operators").doc(id).delete();
    await carregarTecnicos();
  }
};

/* CARREGAR CHAMADOS */
async function carregarChamados(){
  ticketTableBody.innerHTML="<tr><td colspan='8'>Carregando...</td></tr>";
  const snap=await db.collection("tickets").orderBy("date","asc").get();
  tickets=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderTickets();
}

/* RENDERIZAÇÃO */
function renderTickets(){
  ticketTableBody.innerHTML="";
  if(!tickets.length) return ticketTableBody.innerHTML="<tr><td colspan='8'>Nenhum chamado.</td></tr>";
  tickets.forEach(t=>{
    const canEdit = t.status !== "Encerrado";
    const row=document.createElement("tr");
    row.innerHTML=`
      <td>${escapeHtml(t.subject)}</td>
      <td>${escapeHtml(t.client)}</td>
      <td class="text-start">${escapeHtml(t.description)}</td>
      <td>${escapeHtml(t.tech)}</td>
      <td>${escapeHtml(t.priority)}</td>
      <td>${escapeHtml(t.status)}</td>
      <td>${t.date?new Date(t.date).toLocaleString():"-"}</td>
      <td>
        <button class="btn btn-primary btn-sm" onclick="showDetails('${t.id}')"><i class="bi bi-eye"></i></button>
        ${currentUser?.role==='admin' && canEdit
          ? `<button class="btn btn-warning btn-sm ms-1" onclick="editTicket('${t.id}')"><i class="bi bi-pencil-square"></i></button>` : ""}
        ${currentUser?.role==='admin' && t.status!=="Encerrado"
          ? `<button class="btn btn-success btn-sm ms-1" onclick="encerrarChamado('${t.id}')"><i class="bi bi-check2-circle"></i></button>` : ""}
      </td>`;
    ticketTableBody.appendChild(row);
  });
}

/* EDITAR */
window.editTicket=async id=>{
  const t=tickets.find(x=>x.id===id);
  if(!t) return alert("Chamado não encontrado");
  document.getElementById("ticketModalTitle").textContent="Editar Chamado";
  document.getElementById("editingTicketId").value=id;
  document.getElementById("ticketSubject").value=t.subject;
  document.getElementById("ticketClient").value=t.client;
  document.getElementById("ticketDescription").value=t.description;
  document.getElementById("ticketPriority").value=t.priority;
  document.getElementById("ticketStatus").value=t.status;
  await fetchOperators();
  document.getElementById("ticketTech").value=t.tech;
  newTicketModal.show();
};

/* SALVAR */
document.getElementById("ticketForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const id=document.getElementById("editingTicketId").value;
  const data={
    subject:document.getElementById("ticketSubject").value,
    client:document.getElementById("ticketClient").value,
    description:document.getElementById("ticketDescription").value,
    tech:document.getElementById("ticketTech").value,
    priority:document.getElementById("ticketPriority").value,
    status:document.getElementById("ticketStatus").value,
    date:id?tickets.find(t=>t.id===id)?.date:new Date().getTime()
  };
  if(id) await db.collection("tickets").doc(id).update(data);
  else await db.collection("tickets").add(data);
  newTicketModal.hide();
  carregarChamados();
});

/* OUTRAS FUNÇÕES */
async function fetchOperators(){
  const s=await db.collection("operators").get();
  const sel=document.getElementById("ticketTech");
  sel.innerHTML='<option value="">Selecione o Técnico</option>';
  s.forEach(doc=>{
    const o=document.createElement("option");
    o.value=doc.data().name;
    o.textContent=doc.data().name;
    sel.appendChild(o);
  });
}
window.encerrarChamado=async id=>{
  if(confirm("Deseja encerrar este chamado?")){
    await db.collection("tickets").doc(id).update({status:"Encerrado"});
    carregarChamados();
  }
};
window.showDetails=id=>{
  const t=tickets.find(x=>x.id===id);
  if(!t) return alert("Chamado não encontrado");
  alert(`Assunto: ${t.subject}\nCliente: ${t.client}\nDescrição: ${t.description}\nTécnico: ${t.tech}\nStatus: ${t.status}`);
};

/* RELATÓRIO */
btnReport.addEventListener("click", ()=>{
  alert("Função de relatório em desenvolvimento.");
});

/* UTIL */
function escapeHtml(txt){return txt?String(txt).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])):"";}
</script>
</body>
</html>
