<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Chamados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!-- Bootstrap + Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- XLSX e jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --bg: #f8fafc;
    --text: #1e293b;
    --card: #ffffff;
    --border: #e2e8f0;
    --navbar: linear-gradient(90deg, #0d6efd, #0a58ca);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --text: #f8fafc;
    --card: #111827;
    --border: #334155;
    --navbar: linear-gradient(90deg, #1e40af, #1e3a8a);
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, sans-serif;
    transition: background-color .25s, color .25s;
  }

  .navbar { background: var(--navbar); color: #fff !important; }
  .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
  .table thead th { background-color: var(--border); }
  .btn { border-radius: .4rem; font-weight: 500; }
  .theme-toggle { background: transparent; color: #fff; border: none; font-size:1.2rem; }
  #loginContainer { margin-top: 8vh; }
  footer { text-align:center; color: #6c757d; padding:10px; font-size: .85rem; }

  /* 🔥 Destaque chamados abertos de prioridade alta */
  .highlight-high {
    background-color: rgba(255, 0, 0, 0.1) !important;
    border-left: 4px solid red !important;
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid px-4">
    <span class="navbar-brand"><i class="bi bi-headset"></i> Sistema de Chamados</span>
    <div class="d-flex align-items-center gap-2">
      <button id="themeToggle" class="theme-toggle" title="Alterar tema"><i class="bi bi-moon-fill"></i></button>
      <button id="logoutBtn" class="btn btn-light btn-sm d-none"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </div>
</nav>

<!-- LOGIN -->
<div class="container" id="loginContainer">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow-sm mt-5">
        <h4 class="text-center mb-3 text-primary"><i class="bi bi-person-circle"></i> Login</h4>
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input type="text" class="form-control" id="loginUser" placeholder="Digite seu login">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="loginPass" placeholder="Digite sua senha">
        </div>
        <button class="btn btn-primary w-100" id="loginBtn">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="container d-none" id="mainContainer">
  <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
    <h3 class="text-primary"><i class="bi bi-ticket-detailed"></i> Chamados</h3>
    <div>
      <button id="btnNewTicket" class="btn btn-primary btn-sm me-2"><i class="bi bi-plus-lg"></i> Novo Chamado</button>
      <button id="btnUserRegister" class="btn btn-success btn-sm d-none"><i class="bi bi-person-plus"></i> Cadastrar Usuário</button>
    </div>
  </div>

  <!-- Gráfico de Status -->
  <div class="card p-3 mb-4">
    <h5><i class="bi bi-bar-chart"></i> Status dos Chamados</h5>
    <canvas id="statusChart" height="100"></canvas>
  </div>

  <div class="card p-3 mb-4 shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped align-middle text-center">
        <thead>
          <tr>
            <th>Assunto</th><th>Cliente</th><th>Descrição</th><th>Técnico</th>
            <th>Prioridade</th><th>Status</th><th>Data</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="d-flex gap-2 mb-5">
    <button id="btnOperators" class="btn btn-info btn-sm"><i class="bi bi-people"></i> Gerenciar Técnicos</button>
    <button id="btnReport" class="btn btn-warning btn-sm"><i class="bi bi-file-earmark-bar-graph"></i> Relatório PDF/Excel</button>
  </div>
</div>

<!-- MODAIS (iguais ao código anterior, omitidos para brevidade) -->
<!-- ... (usuários, operadores, relatório, novo chamado, footer etc.) -->
<footer>
  <p>© 2025 Sistema de Chamados - Desenvolvido com ❤️ por Eduardo Lima</p>
</footer>

<!-- Bootstrap bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =================== FIREBASE =================== */
const firebaseConfig = {
  apiKey: "AIzaSyBA16WHE768N9eUcqEoQqUF7uEIB82nNM0",
  authDomain: "chamados-37b34.firebaseapp.com",
  projectId: "chamados-37b34",
  storageBucket: "chamados-37b34.firebasestorage.app",
  messagingSenderId: "164935126006",
  appId: "1:164935126006:web:e49fd19961993d5b62d5d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =================== ELEMENTOS =================== */
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginContainer = document.getElementById("loginContainer");
const mainContainer = document.getElementById("mainContainer");
const ticketTableBody = document.getElementById("ticketTableBody");
const btnUserRegister = document.getElementById("btnUserRegister");
const btnNewTicket = document.getElementById("btnNewTicket");
const themeToggle = document.getElementById("themeToggle");
let currentUser = null;
let tickets = [];
let chart = null;

/* =================== LOGIN =================== */
loginBtn.addEventListener("click", async ()=>{
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  const snapshot = await db.collection("users").where("login","==",user).where("password","==",pass).get();
  if(snapshot.empty){ alert("Usuário ou senha incorretos!"); return; }
  currentUser = snapshot.docs[0].data();
  loginContainer.classList.add("d-none");
  mainContainer.classList.remove("d-none");
  logoutBtn.classList.remove("d-none");
  if(currentUser.role==="admin") btnUserRegister.classList.remove("d-none");
  carregarChamados();
});

logoutBtn.addEventListener("click", ()=>{
  currentUser=null;
  loginContainer.classList.remove("d-none");
  mainContainer.classList.add("d-none");
  logoutBtn.classList.add("d-none");
});

/* =================== CARREGAR CHAMADOS =================== */
async function carregarChamados(){
  const snapshot = await db.collection("tickets").orderBy("date","asc").get();
  tickets = snapshot.docs.map(d=>({id:d.id,...d.data()}));
  renderTickets();
  atualizarGrafico();
}

function renderTickets(){
  ticketTableBody.innerHTML="";
  if(tickets.length===0){ticketTableBody.innerHTML="<tr><td colspan='8'>Nenhum chamado.</td></tr>";return;}
  tickets.forEach(t=>{
    const tr=document.createElement("tr");
    if(t.status==="Aberto" && t.priority==="Alta") tr.classList.add("highlight-high");
    tr.innerHTML=`
      <td>${t.subject||"-"}</td>
      <td>${t.client||"-"}</td>
      <td class="text-start">${t.description||"-"}</td>
      <td>${t.tech||"-"}</td>
      <td>${t.priority||"-"}</td>
      <td>${t.status||"-"}</td>
      <td>${t.date ? new Date(t.date).toLocaleString() : "-"}</td>
      <td>
        <button class="btn btn-primary btn-sm"><i class="bi bi-eye"></i></button>
        ${currentUser?.role==="admin" && t.status!=="Encerrado"
          ? `<button class="btn btn-success btn-sm ms-1" onclick="encerrarChamado('${t.id}')"><i class="bi bi-check2-circle"></i></button>`:""}
      </td>`;
    ticketTableBody.appendChild(tr);
  });
}

/* =================== GRÁFICO =================== */
function atualizarGrafico(){
  const statusCount = {Aberto:0,"Em andamento":0,Resolvido:0,Encerrado:0};
  tickets.forEach(t=>{ if(statusCount[t.status]!==undefined) statusCount[t.status]++; });
  const ctx=document.getElementById("statusChart").getContext("2d");
  const data = {
    labels:Object.keys(statusCount),
    datasets:[{
      label:"Chamados",
      data:Object.values(statusCount),
      backgroundColor:["#dc3545","#ffc107","#0d6efd","#198754"]
    }]
  };
  if(chart){ chart.destroy(); }
  chart=new Chart(ctx,{ type:"bar", data, options:{responsive:true, plugins:{legend:{display:false}}}});
}

/* =================== ENCERRAR CHAMADO =================== */
async function encerrarChamado(id){
  if(!confirm("Encerrar chamado?"))return;
  await db.collection("tickets").doc(id).update({status:"Encerrado"});
  carregarChamados();
}

/* =================== TEMA =================== */
function toggleTheme(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  if(dark){document.documentElement.removeAttribute("data-theme");themeToggle.innerHTML='<i class="bi bi-moon-fill"></i>';localStorage.setItem("theme","light");}
  else{document.documentElement.setAttribute("data-theme","dark");themeToggle.innerHTML='<i class="bi bi-sun-fill"></i>';localStorage.setItem("theme","dark");}
}
themeToggle.addEventListener("click",toggleTheme);
window.addEventListener("DOMContentLoaded",()=>{
  const saved=localStorage.getItem("theme");
  if(saved==="dark"){document.documentElement.setAttribute("data-theme","dark");themeToggle.innerHTML='<i class="bi bi-sun-fill"></i>';}
});
</script>
</body>
</html>
